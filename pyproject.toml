# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whence"
version = "0.1.0"
description = "Content-addressed provenance for business figures (proof of concept)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The Whence Authors" }]
keywords = ["provenance", "lineage", "audit", "merkle", "attestation"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "rich>=13.0",
  "click>=8.1",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
whence = "whence.cli:main"

[tool.setuptools]
packages = ["whence", "whence.report"]

[tool.setuptools.package-data]
whence = ["report/*.html", "report/*.css", "report/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
